name: بناء مول الحانوت

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استخراج المشروع
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: استخراج ملف المشروع
        run: |
          mkdir -p project
          unzip -o Moul_Al_Hanout.zip -d project

      - name: البحث عن مشروع Android
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "لم يتم العثور على مشروع Android"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "تم العثور على المشروع في: $PROJECT_DIR"

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: بناء APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: بناء AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle bundleRelease --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Moul-Al-Hanout-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: رفع AAB
        uses: actions/upload-artifact@v4
        with:
          name: Moul-Al-Hanout-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
