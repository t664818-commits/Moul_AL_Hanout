name: Build Moul Al Hanout

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: فك ضغط مشروع مول الحانوت
        run: |
          mkdir -p project
          unzip -o Moul_Al_Hanout.zip -d project

      - name: العثور على مشروع Android
        id: find_project
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android داخل Moul_Al_Hanout.zip"
            echo "محتويات المشروع:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على المشروع في: $PROJECT_DIR"

      - name: إعداد Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper غير موجود، سيتم إنشاؤه..."
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: بناء APK و AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: البحث عن الملفات الناتجة
        shell: bash
        run: |
          echo "===== APK ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          echo "===== AAB ====="
          find "$PROJECT_DIR" -type f -name "*.aab" -print

      - name: تحميل APK
        uses: actions/upload-artifact@v4
        with:
          name: Moul-Al-Hanout-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: تحميل AAB
        uses: actions/upload-artifact@v4
        with:
          name: Moul-Al-Hanout-AAB
          path: |
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: إنهاء البناء
        run: |
          echo "======================================"
          echo "تم الانتهاء من بناء مول الحانوت"
          echo "APK و AAB موجودين في Artifacts"
          echo "======================================"
