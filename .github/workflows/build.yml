name: Build APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. تثبيت الأدوات المطلوبة
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"

      # 5. البحث على مشروع Android
      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          GRADLEW=$(find . -type f -name "gradlew" \
            -not -path "./.git/*" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Searching for settings.gradle..."

            SETTINGS=$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              -not -path "*/node_modules/*" \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android/Gradle project was not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. إعطاء صلاحية لـ Gradle Wrapper
      - name: Prepare Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in $PROJECT_DIR"
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # 7. بناء APK و AAB
      - name: Build APK and AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Cleaning project..."
          ./gradlew clean --no-daemon

          echo "Building APK and AAB..."
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      # 8. البحث على APK و AAB
      - name: Find generated files
        shell: bash
        run: |
          echo "Searching for APK files..."
          find "$PROJECT_DIR" -type f -name "*.apk" \
            -not -path "*/.gradle/*" \
            -print || true

          echo "Searching for AAB files..."
          find "$PROJECT_DIR" -type f -name "*.aab" \
            -not -path "*/.gradle/*" \
            -print || true

      # 9. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 10. رفع AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: |
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
